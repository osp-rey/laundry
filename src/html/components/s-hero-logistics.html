<section class="s-hero">
  <div class="container">
    <div class="s-hero__body _ba-none _logistics">
      <h1 class="m-title s-hero__title">
        Логистика по КМВ —
        <br />
        <span>
          регулярный вывоз
          <br />
          и доставка белья
        </span>
      </h1>
      <p class="s-hero__content">
        Пятигорск, Кисловодск, Ессентуки, Минеральные Воды и близлежащие районы
      </p>
      <div class="s-hero__buttons">
        <a
          href="#modal-feedback"
          data-fancybox
          data-target-note="#input-modal-feedback"
          data-note="Получить КП"
          class="btn-s"
        >
          Получить КП
        </a>
      </div>
      <picture class="s-hero__picture">
        <img src="@img/hero-logistics.png" alt="image" />
      </picture>
    </div>
    <div class="s-hero__adv">
      <div class="s-hero__adv-item">
        <img src="@img/hero-icon-1.svg" alt="image" class="icon" />
        <span class="text-b">
          Собственный
          <br />
          автопарк
        </span>
      </div>
      <div class="s-hero__adv-item">
        <img src="@img/hero-icon-2.svg" alt="image" class="icon" />
        <span class="text-b">
          Четкие графики
          <br />
          без срывов
        </span>
      </div>
      <div class="s-hero__adv-item">
        <img src="@img/hero-icon-3.svg" alt="image" class="icon" />
        <span class="text-b">
          Соблюдение
          <br />
          санитарных норм
        </span>
      </div>
      <div class="s-hero__adv-item">
        <img src="@img/hero-icon-4.svg" alt="image" class="icon" />
        <span class="text-b">
          Работаем
          <br />
          по договору
        </span>
      </div>
    </div>
  </div>
</section>
