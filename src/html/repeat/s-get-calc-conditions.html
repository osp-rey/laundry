<section class="s-get-calc sect-m">
  <div class="container">
    <div class="grid-layout s-get-calc__grid">
      <div class="s-get-calc__gallery">
        <img src="@img/get-calc.jpg" alt="image" />
      </div>
      <div class="s-get-calc__main">
        <div class="s-get-calc__main-head">
          <h2 class="t-title s-get-calc__title">
            Получите
            <span>персональные условия</span>
            для сотрудничества
          </h2>
          <p class="text-m">
            Заполните форму для обратной связи — мы подготовим для вас
            коммерческое предложение с подробным расчетом под ваш объект
          </p>
        </div>
        <form action="#" class="s-get-calc__form">
          <div class="s-get-calc__form-grid">
            <div class="input-control">
              <input type="tel" placeholder="Номер телефона" class="input" />
            </div>
            <div class="input-control">
              <input type="text" placeholder="Название объекта" class="input" />
            </div>
            <div class="input-control">
              <input type="text" placeholder="Город" class="input" />
            </div>
            <div class="input-control">
              <input type="text" placeholder="Объем работ" class="input" />
            </div>
            <div class="input-control">
              <input
                type="text"
                placeholder="Нужен ли экспресс 24 часа"
                class="input"
              />
            </div>
            <button type="submit" class="btn-s">Получить расчет</button>
          </div>
          <div class="check-wrapper">
            <span class="wpcf7-form-control-wrap" data-name="acceptance-84">
              <span class="wpcf7-form-control wpcf7-acceptance">
                <span class="wpcf7-list-item">
                  <label>
                    <input
                      type="checkbox"
                      name="acceptance-84"
                      value="1"
                      required
                      aria-invalid="false"
                    />
                    <span class="wpcf7-list-item-label">
                      <span>
                        Нажимая на кнопку «Отправить», подтверждаю своё согласие
                        с
                        <a href="#" target="_blank">
                          обработкой персональных данных
                        </a>
                        и положениями
                        <a href="#" target="_blank">
                          Политики конфиденциальности
                        </a>
                      </span>
                    </span>
                  </label>
                </span>
              </span>
            </span>
          </div>
        </form>
        <div class="s-get-calc__contacts">
          <div class="s-get-calc__contacts-info">
            <div class="text-m">
              Или свяжитесь с нами другим удобным способом
            </div>
            <a href="tel:+79255550126" class="s-get-calc__contacts-tel">
              +7 (925) 555-01-26
            </a>
          </div>
          <div class="s-get-calc__social">
            <a href="#" target="_blank" class="btn-r">
              <svg>
                <use xlink:href="img/icons/icons.svg#icon-max"></use>
              </svg>
            </a>
            <a href="#" target="_blank" class="btn-r">
              <svg>
                <use xlink:href="img/icons/icons.svg#icon-tg"></use>
              </svg>
            </a>
            <a href="#" target="_blank" class="btn-r _green-h">
              <svg>
                <use xlink:href="img/icons/icons.svg#icon-wh"></use>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
